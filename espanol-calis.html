   Her zaman 6 şahıs: [yo, tú, él/ella/usted, nosotros, vosotros, ellos/ustedes].
   imp/impn: emir (olumlu/olumsuz); 0 = yo (boş). */
const GV_IE=new Set("cerrar comenzar empezar defender despertar entender negar pensar perder preferir querer sentar sentir convertir".split(" ")),
GV_UE=new Set("acordar almorzar contar costar encontrar mostrar probar mover recordar volver devolver resolver dormir morir poder soler".split(" ")),

GV_PRET={tener:"tuv",estar:"estuv",andar:"anduv",poder:"pud",poner:"pus",saber:"sup",caber:"cup",haber:"hub",querer:"quis",venir:"vin",hacer:"hic",decir:"dij",traer:"traj"},

GV_YO={tener:"tengo",venir:"vengo",poner:"pongo",salir:"salgo",valer:"valgo",hacer:"hago",decir:"digo",traer:"traigo",caer:"caigo",oír:"oigo",caber:"quepo",saber:"sé",ver:"veo",dar:"doy",estar:"estoy",ir:"voy",ser:"soy"},

GV_FIX={
 ser:{pres:"soy eres es somos sois son",indef:"fui fuiste fue fuimos fuisteis fueron",imperf:"era eras era éramos erais eran",subj:"sea seas sea seamos seáis sean"},
 ir:{pres:"voy vas va vamos vais van",indef:"fui fuiste fue fuimos fuisteis fueron",imperf:"iba ibas iba íbamos ibais iban",subj:"vaya vayas vaya vayamos vayáis vayan"},

 oír:{pres:"oigo oyes oye oímos oís oyen"},
 reír:{pres:"río ríes ríe reímos reís ríen",indef:"reí reíste rio reímos reísteis rieron",subj:"ría rías ría riamos riais rían"},
 haber:{pres:"he has ha hemos habéis han",subj:"haya hayas haya hayamos hayáis hayan"}
};
const GV_SP=s=>s.split(" ");
function gvParts(inf){
 /* bileşik fiiller: detener → tener, proponer → poner ... */
 for(const b of ["tener","poner","venir","hacer","decir","traer"])if(inf!==b&&inf.endsWith(b))return{pre:inf.slice(0,-b.length),b};
 return{pre:"",b:inf}}
function GC(inf){
 const {pre,b}=gvParts(inf);
 const e=inf.endsWith("ír")?"ir":inf.slice(-2), st=inf.slice(0,-2), fx=GV_FIX[inf]||{};
 const ie=GV_IE.has(inf),ue=GV_UE.has(inf),ei=GV_I.has(inf),jug=inf=="jugar";
 const isIrSC=e=="ir"&&(ie||ue||ei)&&inf!="reír";
 /* kök değişimi (vurgulu hece: yo, tú, él, ellos) */
 const lastV=(s,v,r)=>{const i=s.lastIndexOf(v);return i<0?s:s.slice(0,i)+r+s.slice(i+1)};
 let sst=st;
 if(ie)sst=lastV(st,"e","ie");else if(ue)sst=lastV(st,"o","ue");else if(ei)sst=lastV(st,"e","i");else if(jug)sst="jueg";
 if(GV_ACC[inf])sst=inf=="reunir"?"reún":st.slice(0,-1)+(st.slice(-1)=="i"?"í":"ú");
 /* -ir kök değişimi zayıf hali (e→i, o→u): indef 3. şahıs, subj nos/vos, ulaç */
 const wst=isIrSC?(ue?lastV(st,"o","u"):lastV(st,"e","i")):st;
 const isUir=/uir$/.test(inf)&&!/guir$/.test(inf);
 const isZco=/[aeiou]c(er|ir)$/.test(inf)&&!["hacer","decir","cocer"].includes(b);
 /* presente */
 const EN={ar:["o","as","a","amos","áis","an"],er:["o","es","e","emos","éis","en"],ir:["o","es","e","imos","ís","en"]}[e];
 let pres=EN.map((x,i)=>([0,1,2,5].includes(i)?sst:st)+x);
 if(isUir)pres=EN.map((x,i)=>st+(i==3||i==4?"":"y")+x);
 if(/g[ei]r$/.test(inf))pres[0]=pres[0].replace(/g(o)$/,"j$1");
 if(/guir$/.test(inf))pres[0]=pres[0].replace(/gu(o)$/,"g$1");
 if(isZco)pres[0]=pres[0].replace(/c(o)$/,"zc$1");
 if(GV_YO[b])pres[0]=pre+GV_YO[b];
 if(b=="tener"||b=="venir")pres=[pre+GV_YO[b]].concat(EN.slice(1).map((x,i)=>([0,1,4].includes(i)?lastV(st,"e","ie"):st)+x));
 if(b=="decir")pres=[pre+"digo",pre+"dices",pre+"dice",pre+"decimos",pre+"decís",pre+"dicen"];
 if(fx.pres)pres=GV_SP(fx.pres);
 /* subjuntivo: yo kökü + ters ünlü */
 const SE=e=="ar"?["e","es","e","emos","éis","en"]:["a","as","a","amos","áis","an"];
 const y0=pres[0].replace(/o$/,"");
 const orth=s=>e!="ar"?s:s.replace(/c$/,"qu").replace(/g$/,"gu").replace(/z$/,"c");
 const yoPath=isUir||isZco||!!GV_YO[b]||/g[ei]r$|guir$/.test(inf);
 let subj=yoPath?SE.map(x=>y0+x):SE.map((x,i)=>orth(i==3||i==4?(isIrSC?wst:st):sst)+x);
 if(fx.subj)subj=GV_SP(fx.subj);
 /* indefinido */
 let indef;
 const PB=GV_PRET[b];
 if(PB){const p=pre+PB;indef=[p+"e",p+"iste",p+"o",p+"imos",p+"isteis",p+(/j$/.test(PB)?"eron":"ieron")];if(b=="hacer")indef[2]=pre+"hizo"}
 else if(/ducir$/.test(inf)){const p=inf.slice(0,-3)+"j";indef=[p+"e",p+"iste",p+"o",p+"imos",p+"isteis",p+"eron"]}
 else if(e=="ar"){indef=[orth(st)+"é",st+"aste",st+"ó",st+"amos",st+"asteis",st+"aron"]}
 else{
  const yv=/[aeo]$/.test(st)||isUir; /* leer, caer, oír, construir → y */
  const acc=/[aeo]$/.test(st); /* leíste, caímos */
  const i_=acc?"í":"i";
  indef=[st+"í",st+i_+"ste",(yv?st+"yó":wst+"ió"),st+i_+"mos",st+i_+"steis",(yv?st+"yeron":wst+"ieron")];
 }
 if(fx.indef)indef=GV_SP(fx.indef);
 /* imperfecto */
 let imperf=e=="ar"?["aba","abas","aba","ábamos","abais","aban"].map(x=>st+x):["ía","ías","ía","íamos","íais","ían"].map(x=>st+x);
 if(fx.imperf)imperf=GV_SP(fx.imperf);
 /* futuro / condicional */
 const fs=GV_FUT[b]?pre+GV_FUT[b]:inf.replace(/ír$/,"ir");
 const fut=["é","ás","á","emos","éis","án"].map(x=>fs+x), cond=["ía","ías","ía","íamos","íais","ían"].map(x=>fs+x);
 /* ortaç ve perfecto */
 let part=GV_PP[b]?pre+GV_PP[b]:(e=="ar"?st+"ado":(/[aeo]$/.test(st)?st+"ído":st+"ido"));
 const perf=["he","has","ha","hemos","habéis","han"].map(h=>h+" "+part);
 /* emir */
 let tu=GV_TU[b]?pre+GV_TU[b]:pres[2];
 if(pre&&GV_TU[b])tu=tu.replace(/([aeiou])([nz])$/,(m,v,c)=>({a:"á",e:"é",i:"í",o:"ó",u:"ú"}[v])+c);
 const vos=inf=="ir"?"id":inf.endsWith("ír")?inf.slice(0,-2)+"íd":inf.slice(0,-1)+"d";
 const imp=["",tu,subj[2],inf=="ir"?"vamos":subj[3],vos,subj[5]];
 const impn=["","no "+subj[1],"no "+subj[2],"no "+subj[3],"no "+subj[4],"no "+subj[5]];
 return{pres,indef,imperf,fut,cond,subj,perf,imp,impn,part};
}

/* ===== Gramer sekmesi: Türkçe çekim motoru =====
   TC("konuşmak") → {pres,indef,imperf,fut,cond,subj,imp,impn,aor}
   Şahıslar: [ben, sen, o, biz, siz, onlar]; imp/impn: [—, sen, siz(usted), biz, siz, siz(ustedes)]. */
const TV="aeıioöuü",TBACK="aıou";
const tLastV=s=>{for(let i=s.length-1;i>=0;i--)if(TV.includes(s[i]))return s[i];return"e"};
const tH4=v=>({a:"ı",ı:"ı",o:"u",u:"u",e:"i",i:"i",ö:"ü",ü:"ü"})[v];
const tH2=v=>TBACK.includes(v)?"a":"e";
const tEndsV=s=>TV.includes(s.slice(-1));
const tVc=s=>[...s].filter(c=>TV.includes(c)).length;
const TSOFT=new Set("git et tat güt kaybet reddet hisset affet keşfet seyret hallet naklet sabret bahset terket zannet emret".split(" "));
/* tek heceli kökten türeyen bileşikler geniş zamanda -ar/-er alır: varsay → varsayar */
const TAOR_A=new Set("varsay".split(" "));
const TAOR_I=new Set("al bil bul dur gel gör kal ol öl san var ver vur".split(" "));
/* ünlüyle başlayan ek öncesi kök: git → gid */
const tSoft=st=>TSOFT.has(st)?st.slice(0,-1)+"d":st;
function TC(phrase){
 const sp=phrase.lastIndexOf(" "),pre=sp<0?"":phrase.slice(0,sp+1),w=phrase.slice(sp+1);
 const st=w.replace(/m[ae]k$/,""),ye=st=="ye"||st=="de";
 const P=x=>x.map(f=>f===""?"":pre+f);
 const v=tLastV(st),h4=tH4(v),h2=tH2(v);
 /* şimdiki zaman kökü: konuşuyor, arıyor, yiyor */
 let yor;
 if(ye)yor=st[0]+"iyor";
 else if(tEndsV(st)){const b=st.slice(0,-1);yor=b+tH4(tLastV(b))+"yor"}
 else yor=tSoft(st)+h4+"yor";
 const pres=P([yor+"um",yor+"sun",yor,yor+"uz",yor+"sunuz",yor+"lar"]);
 const imperf=P([yor+"dum",yor+"dun",yor+"du",yor+"duk",yor+"dunuz",yor+"lardı"]);
 /* -di geçmiş */
 const d=/[fstkçşhp]$/.test(st)?"t":"d",di=st+d+h4;
 const indef=P([di+"m",di+"n",di,di+"k",di+"n"+h4+"z",di+"l"+h2+"r"]);
 /* gelecek */
 const fb=ye?st[0]+"iy":tEndsV(st)?st+"y":tSoft(st);
 const ec="e"==h2?"ecek":"acak",eğ="e"==h2?"eceğ":"acağ",k4=tH4(h2);
 const fut=P([fb+eğ+k4+"m",fb+ec+"s"+k4+"n",fb+ec,fb+eğ+k4+"z",fb+ec+"s"+k4+"n"+k4+"z",fb+ec+"l"+h2+"r"]);
 /* geniş zaman (aorist) */
 let aor;
 if(tEndsV(st))aor=st+"r";
 else if((tVc(st)==1&&!TAOR_I.has(st))||(TSOFT.has(st)&&st.endsWith("et"))||TAOR_A.has(st))aor=tSoft(st)+h2+"r";
 else aor=tSoft(st)+h4+"r";
 const av=tLastV(aor),a4=tH4(av),a2=tH2(av);
 const aorP=P([aor+a4+"m",aor+"s"+a4+"n",aor,aor+a4+"z",aor+"s"+a4+"n"+a4+"z",aor+"l"+a2+"r"]);
 const cond=P([aor+"d"+a4+"m",aor+"d"+a4+"n",aor+"d"+a4,aor+"d"+a4+"k",aor+"d"+a4+"n"+a4+"z",aor+"l"+a2+"rd"+tH4(a2)]);
 /* istek kipi (subjuntivo karşılığı) */
 const ib=ye?st[0]+"iy":tEndsV(st)?st+"y":tSoft(st);
 const s3=st+"s"+h4+"n";
 const subj=[0,1,2,3,4,5].map(p=>TNF(phrase).ma(p,"nom")+" gerekiyor");
 /* emir */
 const siz=ye?(st=="ye"?"yiyin":"deyin"):tEndsV(st)?st+"y"+h4+"n":tSoft(st)+h4+"n";
 const biz=ib+h2+"l"+k4+"m";
 const imp=P(["",st,siz,biz,siz,siz]);
 const m=st+"m"+h2,impn=P(["",m,m+"y"+tH4(h2)+"n",m+"y"+h2+"l"+tH4(h2)+"m",m+"y"+tH4(h2)+"n",m+"y"+tH4(h2)+"n"]);

den sorumlu; de + el = del."],["Kedilere alerjisi var.","Es alérgica ___ los gatos.","a",["de","con","por"],"alérgico a = …e alerjik. de çekici ama doğrusu a."],["İlkelerine sadıktır.","Es fiel ___ sus principios.","a",["con","de","en"],"fiel a = …e sadık. con olmaz."],["Haberi dün öğrendim.","Me enteré ___ la noticia ayer.","de",["a","en","con"],"enterarse de = …i öğrenmek (haberini almak). Türkçe «-i» edatsız sanılır ama de ister."],["Radyodan öğrendim.","Me enteré ___ la radio.","por",["de","a","con"],"enterarse por = …aracılığıyla öğrenmek. «de la radio» radyonun kendisi hakkında öğrenmek olur."],["O partiye oy verdim.","Voté ___ ese partido.","por",["a","en","de"],"votar por = …e oy vermek. Türkçe «-e» a'ya iter ama doğrusu por."],["O fikre karşıyım.","Me opongo ___ esa idea.","a",["contra","de","en"],"oponerse a = …e karşı çıkmak. «karşı» contra'ya iter ama oponerse hep a."],["Aramızda kalsın, hoşuma gitmiyor.","___ tú y yo, no me gusta.","Entre",["Para","Con","Según"],"entre tú y yo = aramızda kalsın. entre'den sonra yo/tú gelir (mí/ti değil)."],["Çocuklar bile biliyor.","___ los niños lo saben.","Hasta",["Hacia","Desde","Sin"],"hasta = bile («incluso» gibi). hacia yön, desde başlangıç bildirir."],["İstasyona doğru yürüyor.","Camina ___ la estación.","hacia",["a","en","por"],"hacia = …e doğru (yön). a varış noktasıdır, «doğru» için hacia."],["Saat dokuz civarı varırız.","Llegaremos ___ las nueve.","hacia",["a","por","en"],"hacia + saat = yaklaşık o saatte. a las nueve tam dokuzda olur."],["Yabancı olmana göre çok iyi konuşuyorsun.","___ ser extranjero, hablas muy bien.","Para",["Por","A","De"],"para = …e göre (beklentiye kıyasla). por ser «yabancı olduğun için» sebep olur, anlam farklı."],["Onu uzman sandım.","Lo tomé ___ un experto.","por",["como","de","para"],"tomar por = …sanmak (yanlışlıkla). como «olarak kabul ettim» olur."],["Akşam yemeği daha yapılmadı.","La cena está ___ hacer.","por",["para","a","de"],"estar por + mastar = henüz yapılmamış olmak. «estar para» = …mek üzere/havasında olmak."],["Gitme zamanı.","Es hora ___ irse.","de",["a","para","que"],"es hora de + mastar = …zamanı. para çekici ama kalıp de."]];
