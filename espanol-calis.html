 if(/bilim, teknoloji ve ölçüler/.test(cat)){
   if(/microscopio|telescopio|balanza|lupa/i.test(cleanN))return "—¿Para qué sirve "+hi(w)+"?\n—Sirve para observar o medir con más precisión.";
   if(/experimento/i.test(cleanN))return "—¿Qué hiciste en el laboratorio?\n—Hoy hicimos "+hi(w)+" para comprobar la hipótesis.";
   if(/hipótesis|fórmula|ecuación|cálculo|reacción|mezcla/i.test(cleanN))return "—¿Qué hiciste en el laboratorio?\n—Trabajé con "+hi(w)+" durante la práctica.";
   return "—¿Qué significa "+hi(w)+"?\n—Es un concepto que estudiamos en ciencia.";
 }
 if(/çevre ve doğa/.test(cat)){
   if(/lluvia|tornado|tifón|incendio|alud|tormenta|clima/i.test(cleanN))return "—¿Qué pasó ayer?\n—Hubo "+hi(w)+" y el tiempo cambió de repente.";
   if(/bosque|río|mar|montaña|lago|animal|especie|hábitat|ecosistema/i.test(cleanN))return "—¿Qué podemos hacer para proteger "+hi(w)+"?\n—Lo más importante es reducir el impacto humano.";
   return "—¿Qué significa "+hi(w)+"?\n—Es un concepto relacionado con el medio ambiente.";
 }
 if(/tarih ve kültür/.test(cat))return "—¿Qué aprendiste en clase?\n—Hoy hablamos de "+hi(w)+" y de su importancia histórica o cultural.";
 if(/soyut isimler|kişilik, duygu ve soyut kavramlar/.test(cat))return "—¿Qué significa "+hi(w)+" para ti?\n—Depende de la situación, pero es una idea bastante importante.";
 if(/doğa, hava, hayvanlar|doğa, malzeme, hayvanlar/.test(cat)){
   if(/lluvia|nieve|viento|sol|calor|frío|tiempo|tormenta|nube/i.test(cleanN))return "—¿Qué tiempo hace?\n—Hay "+hi(w)+" desde esta mañana.";
   return "—¿Has visto "+hi(w)+"?\n—Sí, lo vi esta mañana.";
 }

 /* Sıfatlar ve renkler: cümle, kelimenin türüne göre seçiliyor. */
 if(/renkler/.test(cat))return "—¿De qué color es tu coche?\n—Es de color "+escWord()+".";
 if(/sıfat/.test(cat)){
   const base=first(w);
   if(/casad|solter|divorciad|embarazad|muert/i.test(base))return "—¿Cómo está tu hermano?\n—Está "+escWord()+".";
   if(/cansad|agotad|enfer|preocup|content|trist|nervios|emocionad|sorprendid|asustad|enfadad|confundid|aburrid|interesad|decepcionad/i.test(base))return "—¿Cómo está tu hermano hoy?\n—Está bastante "+escWord()+".";
   if(/alto|bajo|gordo|delgado|joven|mayor|guapo|feo|fuerte|débil|grande|pequeño|rápido|lento|nuevo|viejo|amplio|estrecho|cómodo|incómodo/i.test(base))return "—¿Cómo es tu nuevo piso?\n—Es bastante "+escWord()+".";
   return "—¿Cómo describirías la situación?\n—Es bastante "+escWord()+".";
 }
 if(/zarflar ve edat grupları|zarflar ve bağlaçlar/.test(cat))return "—¿Cuándo lo haces?\n—Normalmente lo hago "+escWord()+".";

 /* Güvenli son çare: somut isimlerde doğrudan varlık/konum ilişkisi. */
 if(/^(el|la|los|las|un|una|unos|unas)\s/i.test(w)){
   if(/^(el|la|los|las)$/.test(A))return "—¿Dónde está "+hi(w)+"?\n—Está aquí, junto a la puerta.";
   return "—¿Tienes "+hi(w)+"?\n—Sí, lo tengo aquí.";
 }
 return null;
}
function sayQ(){say((Q.sn||Q.cur.es).replace(/\[\[|\]\]/g,"").replace(/\n/g," "))}
function startQ(){Q={el:{},ok:0,no:0,cur:null};nextQ()}
function nextQ(){
 const a=filt().filter(i=>S.m!="el"||(Q.el[i.es]||0)<2);
 if(!a.length){Q.done=true;Q.opts=null;return render()}
 let c;do{c=rnd(a)}while(a.length>1&&Q.cur&&c.es==Q.cur.es);
 if(S.t=="j"){
   Q={...Q,done:false,cur:c,pick:-1,dir:"es",sn:c.ex.replace("___","[[___]]"),tn:c.tr,ans:c.es};
   const bad=(c.wrong||"").split(",").filter(x=>x&&x!==c.es);
   const pool=shuf(CONJ.filter(i=>bad.includes(i.es)&&i.es!==c.es).map(i=>i.es));
   const extra=shuf(CONJ.filter(i=>i.es!==c.es&&!bad.includes(i.es)).map(i=>i.es));
   Q.opts=shuf([c.es,...pool,...extra]).slice(0,S.n);
   /* Safety: never show a duplicate answer and always keep the key. */
   if(!Q.opts.includes(c.es))Q.opts[0]=c.es;
   return render();
 }
 Object.assign(Q,{done:false,cur:c,pick:-1,dir:S.d=="mix"?rnd(["es","tr"]):S.d});
 const tc=new Set(tok(c.tr)),okp=i=>i.es!=c.es&&!tok(i.tr).some(t=>tc.has(t));
 let pool=filt().filter(okp);if(pool.length<S.n-1)pool=all().filter(okp);
 const es=Q.dir=="es";let ord;
 if(es){const g=cat(c);ord=shuf(pool.filter(i=>cat(i)==g)).concat(shuf(pool.filter(i=>i.l==c.l&&cat(i)!=g)),shuf(pool))}
 else{const kc=pk(c.es);ord=pool.map(i=>[lev(pk(i.es),kc)+Math.random()*.15,i]).sort((x,y)=>x[0]-y[0]).map(x=>x[1])}
 Q.sn=es?mkS(c):null;Q.tn=es&&Q.sn?LASTT:"";Q.ans=es?c.tr:c.es;if(es&&c.t=="p"&&c.ex){const mm=c.tr.split(/\s*\/\s*/),ks=mm.map((_,i)=>i).filter(i=>c.ex[i]);if(ks.length){const k=rnd(ks);Q.ans=mm[k];Q.sn=c.ex[k]}}const seen=new Set([Q.ans]),d=[];
 for(const i of ord){const t=es?(i.t=="p"?rnd(i.tr.split(/\s*\/\s*/)):i.tr):i.es;if(!seen.has(t)){seen.add(t);d.push(t)}if(d.length>=S.n-1)break}
 Q.opts=shuf([Q.ans,...d]);render()}

function ans(j){
 if(Q.pick>=0)return;Q.pick=j;const c=Q.cur;
 if(Q.opts[j]==Q.ans){Q.ok++;Q.el[c.es]=(Q.el[c.es]||0)+1;prog[c.es]=(prog[c.es]||0)+1;sv("es_prog",prog);render();setTimeout(()=>{if(Q.pick>=0&&Q.cur===c)nextQ()},Q.sn?1800:800)}
 else{Q.no++;Q.el[c.es]=0;render()}}
function renderQ(){
 const h=settings();
 if(Q.done){$("#v").innerHTML=`<div class="card"><div class="q">${filt().length?"Tur bitti 🎉":(S.star?"Henüz yıldızlı öğe yok ☆":"Burada öğe yok")}</div><p>${filt().length?`Doğru: ${Q.ok} · Yanlış: ${Q.no}`:"Soruda ☆ ile öğeleri yıldızlayabilirsin."}</p><button class="btn" onclick="startQ()">Yeni tur</button></div>`+h;return}
 if(!Q.opts){startQ();return}
 const f=filt(),left=f.filter(i=>(Q.el[i.es]||0)<2).length,c=Q.cur,es=Q.dir=="es",sn=Q.sn;
 const hl=t=>esc(t).replace(/\[\[(.+?)\]\]/g,"<mark>$1</mark>").replace(/\n/g,"<br>");
 $("#v").innerHTML=`<div class="bar"><span>✓ ${Q.ok} · ✗ ${Q.no}</span><span>${S.m=="el"?`Kalan: ${left}/${f.length}`:"Sürekli mod"}</span></div>`
 +(S.m=="el"?`<div class="prog"><i style="width:${100*(f.length-left)/f.length}%"></i></div>`:"")
 +(S.t=="j"?`<div class="card"><div class="lab">Bağlacı seç</div><div class="q"><span class="sq">${hl(sn)}</span><button class="sp" onclick="stq()">${STAR[c.es]?"★":"☆"}</button><button class="sp" onclick="sayQ()">🔊</button></div>${Q.pick>=0?`<div class="ex2">${esc(c.es)} → ${esc(c.tr)}<br><small>${esc(c.why||"")}</small></div>`:""}</div>`:`<div class="card"><div class="lab">${es?"İspanyolca → Türkçe":"Türkçe → İspanyolca"}</div><div class="q"><span class="${sn?"sq":""}">${es?(sn?hl(sn):esc(c.es)):esc(c.tr)}</span><button class="sp" onclick="stq()">${STAR[c.es]?"★":"☆"}</button>${es?`<button class="sp" onclick="sayQ()">🔊</button>`:""}</div>${es&&sn&&Q.pick>=0?`<div class="ex2">${esc(c.es)} → ${esc(c.tr)}${Q.tn?` · ${esc(Q.tn)}`:""}</div>`:""}</div>`)
 +Q.opts.map((o,j)=>{let cl="";if(Q.pick>=0){if(o==Q.ans)cl="ok";else if(j==Q.pick)cl="no"}return`<button class="o ${cl}" onclick="ans(${j})">${esc(o)}</button>`}).join("")
 +(Q.pick>=0?`<button class="btn" onclick="nextQ()">Devam</button>`:"")+h}
function stq(){tgl(Q.cur.es);render()}function stl(n){tgl(all()[n].es);lst()}
function addOne(){const es=$("#ae").value.trim(),tr=$("#at").value.trim();if(!es||!tr)return;user.push({es,tr,t:$("#ay").value,l:$("#al").value});sv("es_user",user);render()}
function bulk(){const lines=$("#bk").value.split("\n");let n=0;for(const l of lines){const m=l.split(/\s*[=\t]\s*/);if(m.length>=2&&m[0].trim()&&m[1].trim()){user.push({es:m[0].trim(),tr:m[1].trim(),t:m[0].trim().split(/\s+/).length>2?"p":"w",l:$("#al").value});n++}}if(n){sv("es_user",user);render()}}
function del(k){user.splice(k,1);sv("es_user",user);render()}
function renderL(){
 $("#v").innerHTML=`<div class="card"><div class="lab">Yeni ekle</div><input id="ae" placeholder="İspanyolca"><input id="at" placeholder="Türkçe"><select id="ay"><option value="w">Kelime</option><option value="p">Kalıp</option></select><select id="al"><option value="">Seviyesiz</option>${lv.map(l=>`<option value="${l}"${S.l==l?" selected":""}>${l}</option>`).join("")}</select><button class="btn" onclick="addOne()">Ekle</button>
 <details><summary>Toplu ekle (her satır: ispanyolca = türkçe; seviye yukarıdan seçilir)</summary><textarea id="bk" rows="5" placeholder="la ventana = pencere\nTengo sueño = Uykum var"></textarea><button class="btn" onclick="bulk()">İçe aktar</button></details></div>
 <input id="sq" placeholder="Ara..." value="${esc(q)}" oninput="q=this.value;lim=100;lst()"><div class="bar"><span>${all().length} öğe (${user.length} senin eklediğin)</span><span id="cnt"></span></div><div id="ls"></div>`+settings();lst()}
function lst(){
 const a=all().map((i,k)=>({...i,k:k-base.length})).filter(i=>pass(i)&&(!q||(i.es+i.tr).toLowerCase().includes(q.toLowerCase())));
 $("#ls").innerHTML=a.slice(0,lim).map(i=>{const tg=[i.l,i.c,i.t=="p"?"kalıp":""].filter(Boolean);if(!tg.length)tg.push("kelime");return`<div class="row"><span>${esc(i.es)} <small>${tg.map(esc).join(" · ")}${prog[i.es]?` · ✓${prog[i.es]}`:""}</small><br><small>${esc(i.tr)}</small></span><span style="white-space:nowrap"><button class="x st" onclick="stl(${i.k+base.length})">${STAR[i.es]?"★":"☆"}</button>${i.u?`<button class="x" onclick="del(${i.k})">✕</button>`:""}</span></div>`}).join("")+(a.length>lim?`<button class="btn" onclick="lim+=200;lst()">Daha fazla (${a.length-lim} kaldı)</button>`:"");
 const n=$("#cnt");if(n)n.textContent="Gösterilen: "+a.length}
startQ();
</script></body></html>
